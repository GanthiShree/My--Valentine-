<!DOCTYPE html>
<html>
<head>
  <title>My Valentine 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #ffe6f0;
      padding: 20px;
      overflow-x: hidden;
    }

    #quiz {
      margin-top: 50px;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      background-color: #ff4d88;
      color: white;
      font-size: 16px;
      cursor: pointer;
      position: relative;
    }

    button:hover {
      background-color: #e6005c;
    }

    #reaction {
      margin-top: 15px;
      font-weight: bold;
      color: red;
    }
  </style>
</head>

<body>

<div id="quiz"></div>
<div id="reaction"></div>

<!-- 🎵 Background Music -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const questions = [
  {
    question: "If we had to start all over again… would you still choose me? 💍",
    answer: "Yes 💙"
  },
  {
    question: "Do you feel lucky you married me? 😌",
    answer: "Yes 💙"
  },
  {
    question: "Are we the cutest couple you know? 🥰",
    answer: "Yes 💙"
  },
  {
    question: "Will you hold my hand even when we’re 70? 👵👴",
    answer: "Yes 💙"
  }
];

let currentQuestion = 0;

let noMessages = [
  "You will regret this 😤",
  "Think again 😏",
  "I'll cry 🥺",
  "Really sure? 😶",
  "Don’t break my heart 💔",
  "Last chance 😌",
  "Choose wisely mister 😎"
];

function loadQuestion() {
  let q = questions[currentQuestion];
  let noIndex = 0; // Reset for this question

  document.getElementById("quiz").innerHTML = `
    <h1>Answer these honestly 😌</h1>
    <h2>${q.question}</h2>
    <button id="yesBtn">Yes 💙</button>
    <button id="noBtn">No 😜</button>
  `;

  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");

  // Yes button click
  yesBtn.addEventListener("click", () => {
    currentQuestion++;
    if (currentQuestion < questions.length) {
      loadQuestion();
    } else {
      showFinalPage();
    }
  });

  // No button hover & click
  function moveNoButton() {
    noBtn.innerText = noMessages[noIndex];
    noIndex = (noIndex + 1) % noMessages.length;

    let x = Math.random() * (window.innerWidth - 150);
    let y = Math.random() * (window.innerHeight - 150);

    noBtn.style.position = "absolute";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  noBtn.addEventListener("mouseover", moveNoButton);
  noBtn.addEventListener("click", moveNoButton);

  document.getElementById("reaction").innerText = "";
}

function showFinalPage() {
  // 🎵 Play music after user interaction
  let music = document.getElementById("bgMusic");
  music.play().catch(() => {
    document.body.addEventListener("click", () => music.play(), { once: true });
  });

  // Replace entire quiz content with final page
  document.getElementById("quiz").innerHTML = `
    <div style="max-width:600px; margin:auto; padding:20px; text-align:left; font-size:18px; line-height:1.6; color:#cc0066;">
      <h2 style="text-align:center;">To My Forever 💙</h2>

      <p>Even if life gave us another beginning… I would still choose you.</p>
      <p>Not once. Not twice. But in every lifetime.</p>
      <p>Growing old with you… Laughing with you… Holding your hand even at 70… That’s all I want.</p>
      <p>I don’t just love you. I choose you. Every single day.</p>

      <p style="text-align:right;">– Ganthishree ✨</p>
    </div>
  `;
}

loadQuestion();
</script>

</body>
</html>

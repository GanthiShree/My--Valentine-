<!DOCTYPE html>
<html>
<head>
  <title>My Valentine 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #ffe6f0;
      padding: 20px;
      overflow-x: hidden;
    }

    #quiz {
      margin-top: 50px;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      background-color: #ff4d88;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #e6005c;
      transform: scale(1.05);
    }

    .heart {
      position: fixed;
      font-size: 20px;
      animation: floatUp 3s linear forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-300px); opacity: 0; }
    }

    .shake {
      animation: shake 0.4s;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }
  </style>
</head>

<body>

<h1>Answer these honestly 😌</h1>

<div id="quiz"></div>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>

const questions = [
  { question: "If we had to start all over again… would you still choose me? 💍", answer: "Yes ❤️" },
  { question: "Do you feel lucky you married me? 😌", answer: "Yes 💙" },
  { question: "Are we the cutest couple you know? 🥰", answer: "Yes 💙" },
  { question: "Will you hold my hand even when we’re 70? 👵👴", answer: "Yes 💙" }
];

let currentQuestion = 0;

let noMessages = [
  "You will regret this 😤",
  "Think again 😏",
  "I'll cry 🥺",
  "Really sure? 😶",
  "Don’t break my heart 💔",
  "Last chance 😌",
  "Choose wisely mister 😎"
];

let noIndex = 0;

function loadQuestion() {
  let q = questions[currentQuestion];

  document.getElementById("quiz").innerHTML = `
    <h2>${q.question}</h2>
    <button onclick="checkAnswer('Yes 💙')">Yes 💙</button>
    <button id="noBtn"
            onmouseover="moveNoButton()"
            onclick="moveNoButton()">
      No 😜
    </button>
  `;
}

function moveNoButton() {
  let button = document.getElementById("noBtn");

  button.innerText = noMessages[noIndex];
  noIndex = (noIndex + 1) % noMessages.length;

  let x = Math.random() * (window.innerWidth - 150);
  let y = Math.random() * (window.innerHeight - 150);

  button.style.position = "absolute";
  button.style.left = x + "px";
  button.style.top = y + "px";
}

function createHearts() {
  for (let i = 0; i < 15; i++) {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "💕";

    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.top = window.innerHeight - 50 + "px";
    heart.style.fontSize = (20 + Math.random() * 20) + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 3000);
  }
}

function checkAnswer(selected) {
  let correct = questions[currentQuestion].answer;

  if (selected === correct) {

    createHearts(); // 💕 floating hearts

    currentQuestion++;

    if (currentQuestion < questions.length) {
      setTimeout(loadQuestion, 600);
    } else {
      showFinalPage();
    }
  }
}

function showFinalPage() {

  let music = document.getElementById("bgMusic");
  music.play().catch(() => {
    document.body.addEventListener("click", () => music.play(), { once: true });
  });

  document.getElementById("quiz").innerHTML = `
    <div style="max-width:600px; margin:auto; padding:20px; text-align:left; font-size:18px; line-height:1.6; color:#cc0066;">
      
      <h2 style="text-align:center;">To My Forever 💙</h2>

      <p>
      Even if life gave us another beginning…
      I would still choose you.
      </p>

      <p>
      Not once.
      Not twice.
      But in every lifetime.
      </p>

      <p>
      Growing old with you…
      Laughing with you…
      Holding your hand even at 70…
      That’s all I want.
      </p>

      <p>
      I don’t just love you.
      I choose you.
      Every single day.
      </p>

      <p style="text-align:right;">
      – Ganthishree 💙
      </p>

    </div>
  `;
}

loadQuestion();

</script>

</body>
</html>

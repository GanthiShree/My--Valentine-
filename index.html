<!DOCTYPE html>
<html>
<head>
  <title>My Forever 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Romantic Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4, #ffdde1);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      overflow-x: hidden;
      color: #fff;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      font-weight: 500;
      margin-top: 20px;
    }

    #quiz {
      margin-top: 60px;
      background: rgba(255, 255, 255, 0.15);
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    button {
      padding: 12px 24px;
      margin: 10px;
      border: none;
      border-radius: 30px;
      background: rgba(255,255,255,0.3);
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      backdrop-filter: blur(5px);
    }

    button:hover {
      background: rgba(255,255,255,0.5);
      transform: scale(1.1);
    }

    .heart {
      position: fixed;
      animation: floatUp 4s linear forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-400px); opacity: 0; }
    }

    .signature {
      font-family: 'Dancing Script', cursive;
      font-size: 28px;
      text-align: right;
      margin-top: 20px;
    }

  </style>
</head>

<body>

<h1>Answer these honestly 😌</h1>

<div id="quiz"></div>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>

const questions = [
  { question: "If we had to start all over again… would you still choose me? 💍", answer: "Yes ❤️" },
  { question: "Do you feel lucky you married me? 😌", answer: "Yes ❤️" },
  { question: "Are we the cutest couple you know? 🥰", answer: "Yes ❤️" },
  { question: "Will you hold my hand even when we’re 70? 👵👴", answer: "Yes ❤️" }
];

let currentQuestion = 0;

let noMessages = [
  "You will regret this 😤",
  "Think again 😏",
  "I'll cry 🥺",
  "Really sure? 😶",
  "Don’t break my heart 💔",
  "Last chance 😌",
  "Choose wisely mister 😎"
];

let noIndex = 0;

function loadQuestion() {
  window.scrollTo(0, 0);

  let q = questions[currentQuestion];

  document.getElementById("quiz").innerHTML = `
    <h2>${q.question}</h2>
    <button onclick="checkAnswer('Yes ❤️')">Yes ❤️</button>
    <button id="noBtn"
            onmouseover="moveNoButton()"
            onclick="moveNoButton()">
      No 😜
    </button>
  `;
}

function moveNoButton() {
  let button = document.getElementById("noBtn");

  button.innerText = noMessages[noIndex];
  noIndex = (noIndex + 1) % noMessages.length;

  let x = Math.random() * (window.innerWidth - 150);
  let y = Math.random() * (window.innerHeight - 150);

  button.style.position = "absolute";
  button.style.left = x + "px";
  button.style.top = y + "px";
}

function createHearts() {
  for (let i = 0; i < 15; i++) {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "💖";

    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.top = window.innerHeight - 50 + "px";
    heart.style.fontSize = (20 + Math.random() * 20) + "px";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 4000);
  }
}

function startFinalHearts() {
  setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "💗";

    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.top = window.innerHeight + "px";
    heart.style.fontSize = (15 + Math.random() * 30) + "px";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);

  }, 300);
}

function checkAnswer(selected) {
  let correct = questions[currentQuestion].answer;

  if (selected === correct) {

    createHearts();
    currentQuestion++;

    if (currentQuestion < questions.length) {
      loadQuestion();
    } else {
      showFinalPage();
    }
  }
}

function showFinalPage() {

  let music = document.getElementById("bgMusic");
  music.play().catch(() => {
    document.body.addEventListener("click", () => music.play(), { once: true });
  });

  startFinalHearts();

  document.getElementById("quiz").innerHTML = `
    <h2 style="font-family:'Dancing Script', cursive; font-size:36px;">
      To My Forever ❤️
    </h2>

    <p>
    Even if life gave us another beginning…
    I would still choose you.
    </p>

    <p>
    Not once. Not twice.
    But in every lifetime.
    </p>

    <p>
    Growing old with you…
    Laughing with you…
    Holding your hand even at 70…
    That’s all I want.
    </p>

    <p>
    I don’t just love you.
    I choose you.
    Every single day.
    </p>

    <div class="signature">
      – Ganthishree ✨
    </div>
  `;
}

loadQuestion();

</script>

</body>
</html>
